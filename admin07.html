<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Nông Trại Vui Vẻ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase Web SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    
    window.FirebaseLib = { initializeApp, getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, deleteDoc, getDocs, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    /* Ẩn thanh cuộn cho menu trên mobile để nhìn đẹp hơn */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const ADMIN_CREDS = { user: 'admin', pass: 'admin123' };
    const USERS_PER_PAGE = 10;
    
    // --- Đồng bộ cấu hình rich-farm-7601d cho Admin App ---
    const defaultFirebaseConfig = {
      apiKey: "AIzaSyCmL4xml7D5Q4qNqr9lAe2KsE1k-Mt7Ww0", 
      authDomain: "rich-farm-7601d.firebaseapp.com",
      projectId: "rich-farm-7601d",
      storageBucket: "rich-farm-7601d.firebasestorage.app",
      messagingSenderId: "801837672034",
      appId: "1:801837672034:web:19a5044501d75df0e2933b",
      databaseURL: "https://rich-farm-7601d-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : defaultFirebaseConfig;

    const appId = typeof __app_id !== 'undefined' ? __app_id : "rich_farm_app";

    function AdminApp() {
      // SỬA: Lấy trạng thái đăng nhập từ localStorage khi khởi động
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return localStorage.getItem('adminLoggedIn') === 'true';
      });
      const [loginData, setLoginData] = useState({ user: '', pass: '' });
      const [activeTab, setActiveTab] = useState('dashboard');
      const [db, setDb] = useState(null);
      const [allUsers, setAllUsers] = useState([]);
      
      // States cho Quản lý User
      const [searchUser, setSearchUser] = useState('');
      const [userPage, setUserPage] = useState(1);

      // --- Khởi tạo Firebase Tối ưu cho Admin ---
      useEffect(() => {
        const initFirebase = async () => {
          try {
            const { initializeApp, getFirestore, getAuth, signInAnonymously, signInWithCustomToken } = window.FirebaseLib;
            let app;
            try {
              app = initializeApp(firebaseConfig);
            } catch (e) {
              // Đã khởi tạo
            }
            const firestoreDb = getFirestore(app);
            const auth = getAuth(app);
            setDb(firestoreDb);

            // Đăng nhập an toàn ẩn danh
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Lỗi khởi tạo Firebase trong Admin: ", error);
          }
        };

        if (window.FirebaseLib) {
          initFirebase();
        } else {
          const checkLib = setInterval(() => {
            if (window.FirebaseLib) {
              initFirebase();
              clearInterval(checkLib);
            }
          }, 300);
          return () => clearInterval(checkLib);
        }
      }, []);

      // Lắng nghe dữ liệu tất cả Users Realtime từ Firestore
      useEffect(() => {
        if (isLoggedIn && db) {
          const { collection, onSnapshot } = window.FirebaseLib;
          const usersColl = collection(db, 'artifacts', appId, 'public', 'data', 'users');

          const unsubscribe = onSnapshot(usersColl, (querySnapshot) => {
            let usersList = [];
            querySnapshot.forEach((docSnap) => {
              usersList.push(docSnap.data());
            });
            setAllUsers(usersList);
          }, (error) => {
            console.error("Lỗi lấy danh sách User Realtime: ", error);
          });

          return () => unsubscribe();
        }
      }, [isLoggedIn, db]);

      const formatMoney = (amount) => (amount || 0).toLocaleString('vi-VN') + 'đ';

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginData.user === ADMIN_CREDS.user && loginData.pass === ADMIN_CREDS.pass) {
          // SỬA: Lưu trạng thái vào localStorage
          localStorage.setItem('adminLoggedIn', 'true');
          setIsLoggedIn(true);
        } else {
          alert('Sai tài khoản hoặc mật khẩu quản trị!');
        }
      };

      const handleLogout = () => {
        // SỬA: Xóa trạng thái khi đăng xuất
        localStorage.removeItem('adminLoggedIn');
        setIsLoggedIn(false);
      };

      const handleTxAction = async (username, txId, action) => {
        if (!window.confirm(`Xác nhận ${action === 'approve' ? 'DUYỆT' : 'TỪ CHỐI'} giao dịch này?`)) return;
        
        const { doc, getDoc, updateDoc } = window.FirebaseLib;
        const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
        
        const docSnap = await getDoc(userDocRef);
        if (!docSnap.exists()) return alert("Không tìm thấy user!");

        const targetUser = docSnap.data();
        let tx = targetUser.transactions.find(t => t.id === txId);
        if (!tx || tx.status !== 'Đang xử lý') return alert("Giao dịch không hợp lệ hoặc đã được xử lý!");

        let updatedBalance = targetUser.balance;
        const updatedTxs = targetUser.transactions.map(t => {
          if (t.id === txId) {
            if (action === 'approve') {
              t.status = 'Thành công';
              if (t.type === 'Nạp tiền') {
                updatedBalance += t.amount;
              }
            } else {
              t.status = 'Thất bại';
              if (t.type === 'Rút tiền') {
                updatedBalance += t.amount; // Hoàn tiền rút
              }
            }
          }
          return t;
        });

        await updateDoc(userDocRef, {
          balance: updatedBalance,
          transactions: updatedTxs
        });
        alert("Xử lý giao dịch thành công!");
      };

      const handleBanUser = async (username, currentStatus) => {
        const actionStr = currentStatus ? "MỞ KHÓA" : "KHÓA";
        if (!window.confirm(`Bạn có chắc muốn ${actionStr} tài khoản ${username}?`)) return;
        
        const { doc, updateDoc } = window.FirebaseLib;
        const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
        
        await updateDoc(userDocRef, {
          isBanned: !currentStatus
        });
        alert(`${actionStr} tài khoản thành công!`);
      };

      const handleDeleteUser = async (username) => {
        if (!window.confirm(`CẢNH BÁO TỐI CAO: Bạn có chắc chắn muốn XÓA VĨNH VIỄN tài khoản ${username}? Hành động này KHÔNG THỂ hoàn tác!`)) return;
        
        const { doc, deleteDoc } = window.FirebaseLib;
        const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
        
        await deleteDoc(userDocRef);
        alert("Đã xóa vĩnh viễn tài khoản!");
      };

      const handleAddFunds = async (username) => {
        const amountStr = window.prompt(`Nhập số tiền muốn cộng cho ${username} (Nhập số âm để trừ tiền, ví dụ: -50000):`);
        if (amountStr === null || amountStr.trim() === '') return;
        
        const amount = parseInt(amountStr);
        if (isNaN(amount)) return alert("Vui lòng nhập một số hợp lệ!");

        if (!window.confirm(`Xác nhận ${amount >= 0 ? 'CỘNG' : 'TRỪ'} ${formatMoney(Math.abs(amount))} cho tài khoản ${username}?`)) return;

        const { doc, getDoc, updateDoc } = window.FirebaseLib;
        const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
            const uData = docSnap.data();
            const nextBalance = uData.balance + amount;
            const updatedTxs = [{
                id: 'ADM_' + Date.now(),
                type: amount >= 0 ? 'Admin Cộng Tiền' : 'Admin Trừ Tiền',
                amount: Math.abs(amount),
                desc: 'Hệ thống điều chỉnh số dư trực tuyến',
                status: 'Thành công',
                time: new Date().toISOString()
            }, ...(uData.transactions || [])];

            await updateDoc(userDocRef, {
              balance: nextBalance,
              transactions: updatedTxs
            });
            alert("Đã cập nhật ví người dùng!");
        }
      };

      const getUserStats = (transactions = []) => {
        let totalDeposit = 0;
        let totalWithdraw = 0;
        transactions.forEach(tx => {
          if (tx.status === 'Thành công') {
            if (tx.type === 'Nạp tiền') totalDeposit += tx.amount;
            if (tx.type === 'Rút tiền') totalWithdraw += tx.amount;
          }
        });
        return { totalDeposit, totalWithdraw };
      };

      // Đăng nhập View (Sửa Responsive)
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-white p-6 md:p-8 rounded-xl shadow-lg w-full max-w-sm">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-3xl">🛡️</div>
                <h1 className="text-2xl font-bold text-gray-800">Admin Panel</h1>
                <p className="text-gray-500 text-sm">Hệ thống quản trị Nông Trại</p>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Tài khoản</label>
                  <input type="text" value={loginData.user} onChange={e => setLoginData({...loginData, user: e.target.value})} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                  <input type="password" value={loginData.pass} onChange={e => setLoginData({...loginData, pass: e.target.value})} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
                </div>
                <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition mt-2">Đăng Nhập</button>
              </div>
            </form>
          </div>
        );
      }

      // Extract Data for Views
      let pendingTxs = [];
      let totalBalance = 0;
      let sysTotalDeposit = 0;
      let sysTotalWithdraw = 0;

      allUsers.forEach(u => {
        if (!u.isBanned) {
          totalBalance += u.balance || 0;
        }

        const stats = getUserStats(u.transactions);
        sysTotalDeposit += stats.totalDeposit;
        sysTotalWithdraw += stats.totalWithdraw;

        if (u.transactions) {
          u.transactions.forEach(t => {
            if (t.status === 'Đang xử lý') pendingTxs.push({...t, username: u.username, phone: u.phone, bankInfo: u.bankInfo });
          });
        }
      });
      pendingTxs.sort((a,b) => new Date(b.time) - new Date(a.time));

      const pendingDeposits = pendingTxs.filter(t => t.type === 'Nạp tiền');
      const pendingWithdraws = pendingTxs.filter(t => t.type === 'Rút tiền');

      // Filter & Pagination for Users
      const filteredUsers = allUsers.filter(u => 
        u.username.toLowerCase().includes(searchUser.toLowerCase()) || 
        (u.phone && u.phone.includes(searchUser))
      );
      const totalUserPages = Math.ceil(filteredUsers.length / USERS_PER_PAGE) || 1;
      const displayedUsers = filteredUsers.slice((userPage - 1) * USERS_PER_PAGE, userPage * USERS_PER_PAGE);

      // SỬA: Bố cục chính flex-col trên mobile, flex-row trên desktop
      return (
        <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-gray-50">
          
          {/* Sidebar Sửa cho Mobile */}
          <aside className="w-full md:w-64 bg-gray-900 text-white flex flex-col flex-shrink-0 z-10">
            <div className="p-4 md:p-5 border-b border-gray-800 flex justify-between items-center">
              <h2 className="text-lg md:text-xl font-bold tracking-wider text-blue-400">ADMIN PANEL</h2>
              {/* Nút thoát cho mobile */}
              <button onClick={handleLogout} className="md:hidden text-xs bg-red-600 px-3 py-1.5 rounded text-white font-medium">Thoát</button>
            </div>
            {/* Menu dạng cuộn ngang trên mobile */}
            <nav className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar p-2 md:p-4 gap-2 border-b md:border-b-0 border-gray-800">
              <button onClick={() => setActiveTab('dashboard')} className={`whitespace-nowrap flex items-center gap-2 px-3 md:px-4 py-2 md:py-3 rounded-lg transition text-sm md:text-base ${activeTab==='dashboard' ? 'bg-blue-600' : 'hover:bg-gray-800'}`}>
                <span>📊</span> Tổng Quan
              </button>
              <button onClick={() => setActiveTab('deposits')} className={`whitespace-nowrap flex items-center gap-2 px-3 md:px-4 py-2 md:py-3 rounded-lg transition text-sm md:text-base ${activeTab==='deposits' ? 'bg-blue-600' : 'hover:bg-gray-800'}`}>
                <span>📥</span> Duyệt Nạp {pendingDeposits.length > 0 && <span className="ml-1 bg-red-500 text-xs px-2 py-0.5 rounded-full">{pendingDeposits.length}</span>}
              </button>
              <button onClick={() => setActiveTab('withdraws')} className={`whitespace-nowrap flex items-center gap-2 px-3 md:px-4 py-2 md:py-3 rounded-lg transition text-sm md:text-base ${activeTab==='withdraws' ? 'bg-blue-600' : 'hover:bg-gray-800'}`}>
                <span>📤</span> Duyệt Rút {pendingWithdraws.length > 0 && <span className="ml-1 bg-red-500 text-xs px-2 py-0.5 rounded-full">{pendingWithdraws.length}</span>}
              </button>
              <button onClick={() => {setActiveTab('users'); setUserPage(1);}} className={`whitespace-nowrap flex items-center gap-2 px-3 md:px-4 py-2 md:py-3 rounded-lg transition text-sm md:text-base ${activeTab==='users' ? 'bg-blue-600' : 'hover:bg-gray-800'}`}>
                <span>👥</span> Thành Viên
              </button>
            </nav>
            {/* Nút thoát cho desktop */}
            <div className="hidden md:block p-4 border-t border-gray-800 mt-auto">
              <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white rounded-lg transition">Đăng Xuất</button>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8">
            
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <h2 className="text-xl md:text-2xl font-bold text-gray-800">Tổng Quan Hệ Thống</h2>
                {/* Sửa grid responsive */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                    <p className="text-sm font-medium text-gray-500 mb-1">Tổng Số Thành Viên</p>
                    <p className="text-xl md:text-2xl font-bold text-gray-800">{allUsers.length}</p>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-yellow-500">
                    <p className="text-sm font-medium text-gray-500 mb-1">Tổng Tiền Lưu Hành</p>
                    <p className="text-xl md:text-2xl font-bold text-yellow-600">{formatMoney(totalBalance)}</p>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                    <p className="text-sm font-medium text-gray-500 mb-1">Tổng Nạp Thành Công</p>
                    <p className="text-xl md:text-2xl font-bold text-green-600">{formatMoney(sysTotalDeposit)}</p>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-red-500">
                    <p className="text-sm font-medium text-gray-500 mb-1">Tổng Rút Thành Công</p>
                    <p className="text-xl md:text-2xl font-bold text-red-600">{formatMoney(sysTotalWithdraw)}</p>
                  </div>
                </div>
              </div>
            )}

            {(activeTab === 'deposits' || activeTab === 'withdraws') && (() => {
              const txList = activeTab === 'deposits' ? pendingDeposits : pendingWithdraws;
              const title = activeTab === 'deposits' ? "Đơn Nạp Tiền Chờ Duyệt" : "Đơn Rút Tiền Chờ Duyệt";
              
              return (
                <div className="space-y-4 md:space-y-6">
                  <h2 className="text-xl md:text-2xl font-bold text-gray-800">{title}</h2>
                  {txList.length === 0 ? (
                    <div className="bg-white p-6 text-center rounded-xl border border-gray-200 text-gray-500 text-sm md:text-base">Không có đơn hàng nào đang chờ.</div>
                  ) : (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                      {/* Bọc bảng trong thẻ cho phép cuộn ngang */}
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm min-w-[700px]">
                          <thead className="bg-gray-100 border-b border-gray-200">
                            <tr>
                              <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Thời gian</th>
                              <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Tài khoản</th>
                              <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Số Tiền (VND)</th>
                              <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600">Thông tin chi tiết</th>
                              <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 text-right whitespace-nowrap">Thao Tác</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-100">
                            {txList.map(tx => (
                              <tr key={tx.id} className="hover:bg-gray-50">
                                <td className="px-4 py-3 md:px-6 md:py-4 text-gray-500 text-xs md:text-sm">{new Date(tx.time).toLocaleString('vi-VN')}</td>
                                <td className="px-4 py-3 md:px-6 md:py-4 font-medium text-gray-900">{tx.username}<br/><span className="text-xs text-gray-400">SĐT: {tx.phone}</span></td>
                                <td className="px-4 py-3 md:px-6 md:py-4 font-bold text-gray-800">
                                  {formatMoney(tx.amount)}
                                  {tx.type === 'Rút tiền' && <div className="text-xs text-red-500 font-normal">Thực nhận: {formatMoney(tx.realReceive)}</div>}
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 text-gray-600">
                                  {tx.type === 'Rút tiền' && tx.bankInfo ? (
                                    <div className="text-xs whitespace-nowrap">
                                      <span className="font-semibold text-sm">{tx.bankInfo.bankName}</span><br/>
                                      STK: {tx.bankInfo.accNo}<br/>
                                      Tên: {tx.bankInfo.fullName}
                                    </div>
                                  ) : (
                                    <span className="text-xs text-gray-400 break-all">Mã Đơn: {tx.id}</span>
                                  )}
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 text-right space-x-2 whitespace-nowrap">
                                  <button onClick={() => handleTxAction(tx.username, tx.id, 'approve')} className="px-3 py-1.5 bg-green-500 text-white font-medium rounded hover:bg-green-600 transition shadow-sm">Duyệt</button>
                                  <button onClick={() => handleTxAction(tx.username, tx.id, 'reject')} className="px-3 py-1.5 bg-red-50 text-red-600 font-medium rounded hover:bg-red-100 transition border border-red-200">Từ chối</button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {activeTab === 'users' && (
              <div className="space-y-4">
                {/* Sửa responsive thanh tìm kiếm */}
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-3">
                  <h2 className="text-xl md:text-2xl font-bold text-gray-800">Quản Lý Thành Viên</h2>
                  
                  <div className="relative w-full md:w-auto">
                    <span className="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    <input 
                      type="text" 
                      placeholder="Tìm User / Số điện thoại..." 
                      value={searchUser}
                      onChange={(e) => {setSearchUser(e.target.value); setUserPage(1);}}
                      className="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-72 shadow-sm"
                    />
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                  {/* Bọc bảng user trong thẻ cuộn ngang */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm min-w-[800px]">
                      <thead className="bg-gray-100 border-b border-gray-200">
                        <tr>
                          <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Tài khoản</th>
                          <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">SĐT / Referrer</th>
                          <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Tài sản (Dư & Đất)</th>
                          <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Thống Kê Nạp/Rút</th>
                          <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 whitespace-nowrap">Trạng thái</th>
                          <th className="px-4 py-3 md:px-6 md:py-4 font-semibold text-gray-600 text-right whitespace-nowrap">Thao Tác</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {displayedUsers.length === 0 ? (
                          <tr><td colSpan="6" className="text-center py-8 text-gray-500">Không tìm thấy thành viên nào.</td></tr>
                        ) : (
                          displayedUsers.map(u => {
                            const stats = getUserStats(u.transactions);
                            const f1Count = allUsers.filter(x => x.referrer === u.referralCode).length;

                            return (
                              <tr key={u.username} className="hover:bg-gray-50">
                                <td className="px-4 py-3 md:px-6 md:py-4 whitespace-nowrap">
                                  <div className="font-bold text-gray-900 text-base">{u.username}</div>
                                  <div className="text-xs text-gray-400">Mã GT: {u.referralCode}</div>
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 text-xs text-gray-600 whitespace-nowrap">
                                  SĐT: <span className="font-medium text-gray-800">{u.phone}</span><br/>
                                  Tuyến trên: {u.referrer || <span className="text-gray-400 italic">Không có</span>}<br/>
                                  <span className="font-bold text-blue-600 mt-1 inline-block">Đã mời: {f1Count} F1</span>
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 whitespace-nowrap">
                                  <div className="font-bold text-yellow-600 text-base">{formatMoney(u.balance || 0)}</div>
                                  <div className="text-xs text-green-700 bg-green-50 inline-block px-2 py-0.5 rounded border border-green-200 mt-1">Đất cấp: {u.landLevel}</div>
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 text-xs min-w-[150px]">
                                  <div className="flex justify-between items-center mb-1">
                                    <span className="text-gray-500">Tổng nạp:</span>
                                    <span className="font-bold text-green-600">{formatMoney(stats.totalDeposit)}</span>
                                  </div>
                                  <div className="flex justify-between items-center">
                                    <span className="text-gray-500">Tổng rút:</span>
                                    <span className="font-bold text-red-600">{formatMoney(stats.totalWithdraw)}</span>
                                  </div>
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 whitespace-nowrap">
                                  <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${u.isBanned ? 'bg-red-50 text-red-600 border-red-200' : 'bg-green-50 text-green-600 border-green-200'}`}>
                                    {u.isBanned ? 'Bị Khóa' : 'Hoạt Động'}
                                 </span>
                                </td>
                                <td className="px-4 py-3 md:px-6 md:py-4 text-right">
                                  <div className="flex flex-col items-end gap-1.5">
                                      <div className="flex gap-1">
                                          <button 
                                            onClick={() => handleAddFunds(u.username)} 
                                            className="px-2.5 py-1 font-medium rounded transition text-xs bg-yellow-100 text-yellow-700 border border-yellow-300 hover:bg-yellow-200 whitespace-nowrap"
                                          >
                                            Cộng Tiền
                                          </button>
                                          <button 
                                            onClick={() => handleBanUser(u.username, u.isBanned)} 
                                            className={`px-2.5 py-1 font-medium rounded transition text-xs border whitespace-nowrap ${u.isBanned ? 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50' : 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100'}`}
                                          >
                                            {u.isBanned ? 'Mở Khóa' : 'Khóa Acc'}
                                          </button>
                                      </div>
                                      
                                      {u.isBanned && (
                                          <button 
                                            onClick={() => handleDeleteUser(u.username)} 
                                            className="px-2.5 py-1 w-full font-medium rounded transition text-xs bg-red-600 text-white border border-red-700 hover:bg-red-700 whitespace-nowrap"
                                          >
                                            Xóa Vĩnh Viễn
                                          </button>
                                      )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                  
                  {/* Phân Trang (Mobile hiển thị cuộn nếu cần) */}
                  {totalUserPages > 1 && (
                    <div className="bg-gray-50 px-4 py-3 md:px-6 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-3">
                      <span className="text-xs md:text-sm text-gray-500">Đang hiện {displayedUsers.length}/{filteredUsers.length}</span>
                      <div className="flex items-center gap-2">
                        <button 
                          disabled={userPage === 1} 
                          onClick={() => setUserPage(p => p - 1)}
                          className="px-3 py-1 border border-gray-300 rounded bg-white text-gray-600 text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100"
                        >
                          Trang trước
                        </button>
                        <span className="text-sm font-medium text-gray-700 px-2">{userPage} / {totalUserPages}</span>
                        <button 
                          disabled={userPage === totalUserPages} 
                          onClick={() => setUserPage(p => p + 1)}
                          className="px-3 py-1 border border-gray-300 rounded bg-white text-gray-600 text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100"
                        >
                          Trang sau
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
  <script src="baomat.min.js"></script> 
</body>
</html>
